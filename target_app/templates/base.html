<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}CoreView Demo{% endblock %}</title>
    <style>
      body {
        background: #e7e7e7;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        margin: 0;
      }

      #content {
        background: #fff;
        border: 1px solid #777;
        margin: 12px;
        padding: 14px;
      }

      h1, h2 {
        color: #17365d;
        margin-top: 0;
      }

      table {
        border-collapse: collapse;
        margin: 12px 0;
        min-width: 520px;
      }

      caption {
        font-weight: bold;
        padding: 4px;
        text-align: left;
      }

      th, td {
        border: 1px solid #777;
        padding: 6px 9px;
        text-align: left;
      }

      th {
        background: #d9e2f3;
      }

      .toolbar {
        background: #d9e2f3;
        border: 1px solid #777;
        margin-top: 12px;
        padding: 7px;
      }

      .message.error {
        color: #9c0006;
        font-weight: bold;
      }

      a {
        color: #003399;
      }
    </style>
  </head>
  <body>
    <div id="content">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
