<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="application-name" content="CoreView Demo">
    <title>CoreView Member Servicing</title>
    <style>
      body {
        background: #b7c9e2;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      .masthead {
        background: #17365d;
        color: #fff;
        font-weight: bold;
        padding: 10px 14px;
      }

      iframe {
        background: #fff;
        border: 2px inset #777;
        box-sizing: border-box;
        height: calc(100vh - 58px);
        margin: 8px;
        width: calc(100% - 16px);
      }
    </style>
  </head>
  <body>
    <div class="masthead">CoreView Member Servicing</div>
    <iframe
      name="memberWorkspace"
      src="/workspace/search"
      title="Member servicing workspace"
    ></iframe>
  </body>
</html>
